[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc_bot_core"
version = "0.1.0"
description = "Shared core for SMC bot packages (DB, settings, payload models)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["smc_bot_core*"]
