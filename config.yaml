# FTMO 2-Step rules — default cho challenge phase
ftmo:
  account_size: 100000
  phase: challenge              # challenge | verification | funded
  profit_target: 0.10
  max_daily_loss: 0.05
  max_total_loss: 0.10
  timezone: "Europe/Paris"      # FTMO dùng CE(S)T

# Risk management
risk:
  per_trade_pct: 0.0055         # 0.55% per trade
  max_trades_per_day: 3
  daily_loss_limit_r: 2.0       # mất 2R trong ngày → dừng
  max_open_positions: 1         # chỉ 1 lệnh tại 1 thời điểm

# Strategy — SMC core
strategy:
  swing_length: 10
  rr_target: 2.5
  displacement_atr_mult: 1.5    # candle range > 1.5× ATR
  sweep_atr_buffer: 0.05        # vượt swing ≥ 0.05× ATR
  min_confluence_score: 4       # tối thiểu 4/5
  require_displacement: true    # BẮT BUỘC
  require_bias_aligned: true    # BẮT BUỘC

  # Partial TP: 40% tại 2R, 30% tại 3R, 30% tại 4R
  partial_tp:
    - {pct: 0.40, r: 2.0, move_sl_to: entry}   # BE sau khi hit 2R
    - {pct: 0.30, r: 3.0, move_sl_to: entry}   # BE giữ
    - {pct: 0.30, r: 4.0, move_sl_to: entry}

  # Exit mode: 'ladder' (PartialTPExit default) | 'scale_in' (ScaleInExit 2R/4R)
  # Backtest validated: scale_in +23% PnL, -44% DD vs ladder trên EURUSD 2016-2026.
  # Manual trade 8 tuần vẫn dùng ladder. Bot/backtest opt-in.
  exit_mode: ladder
  # Optional Design B: leg2 takes 50% profit at this R from original entry.
  # null/omitted = Design A (leg2 runs full to 4R). Set to 3.0 for Design B.
  # Design B: winrate +5.7pp, DD -0.5pp, nhưng PnL -3.2% vs Design A.
  leg2_tp1_r: null

  sl_atr_buffer: 0.2            # SL thêm 0.2× ATR buffer dưới OB

# Confluence scoring
confluence:
  weights:
    displacement: 1             # BẮT BUỘC
    bias_aligned: 1             # BẮT BUỘC
    sweep_clean: 1
    premium_discount: 1
    first_test: 1

# Pairs
pairs:
  - EURUSD
  - XAUUSD
  - BTCUSD

# Timeframes
timeframes:
  - D
  - H4
  - H1
  - M15

# Sessions (NY time, EST)
sessions:
  asia: {start: "19:00", end: "02:00"}
  london: {start: "02:00", end: "05:00"}
  new_york: {start: "07:00", end: "10:00"}
  overlap: {start: "08:00", end: "10:00"}    # London + NY

# Trade chỉ trong các session này
active_sessions:
  - london
  - new_york
  - overlap

# Pip value (USD per 1.0 lot per 1 pip)
pip_values:
  EURUSD: 10.0
  XAUUSD: 1.0     # XAU: 1 pip = $0.01, 1 lot = 100 oz
  BTCUSD: 1.0     # BTC: đơn vị USD, 1 lot = 1 BTC

# Data download
data:
  years: 10
  dukascopy_eurusd_url: "https://data.dukasbase.com/dukascopy-pip-data/EURUSD/"
  histdata_xau_url: "https://www.histdata.com/download/free-1-minute-foreign-exchange-data/"
  binance_btc_symbol: "BTC/USDT"
