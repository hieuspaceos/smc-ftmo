# FTMO 2-Step rules — default cho challenge phase
ftmo:
  account_size: 100000
  phase: challenge              # challenge | verification | funded
  profit_target: 0.10
  max_daily_loss: 0.05
  max_total_loss: 0.10
  timezone: "Europe/Paris"      # FTMO dùng CE(S)T

# Execution costs (Phase 08 Step 2 — 2026-08-31)
# Spread modeled per-pair; commission + slippage applied uniformly.
# FTMO commission: $5/lot round trip = $2.50/side per standard lot.
# See plans/260831-XXXX-system-validation-master/phase-08-trust-backtest.md
execution:
  spread_pips:
    EURUSD: 0.5    # FTMO typical during active sessions
    GBPUSD: 0.7
    USDCHF: 0.8    # CHF typically wider spread
    XAUUSD: 2.0    # gold spread wider than FX
    BTCUSD: 5.0    # crypto spread widest
  commission_per_lot_per_side: 2.50  # FTMO $5/lot round trip = $2.50 per side
  slippage_pips:
    mean: 0.1      # average slippage when filling
    std: 0.3       # slippage distribution width (Gaussian)
risk:
  per_trade_pct: 0.0055         # 0.55% per trade
  max_trades_per_day: 3
  daily_loss_limit_r: 2.0       # mất 2R trong ngày → dừng
  max_open_positions: 1         # chỉ 1 lệnh tại 1 thời điểm

# Strategy — SMC core
strategy:
  swing_length: 10
  rr_target: 2.5
  displacement_atr_mult: 1.5    # candle range > 1.5× ATR
  sweep_atr_buffer: 0.05        # vượt swing ≥ 0.05× ATR
  min_confluence_score: 4       # tối thiểu 4/5
  require_displacement: true    # BẮT BUỘC
  require_bias_aligned: true    # BẮT BUỘC
  sl_atr_buffer: 0.2            # SL thêm 0.2× ATR buffer dưới OB
  # Pine parity: HTF enable flags. Default True (Pine defaults).
  # Set htf_daily_enabled=false and/or htf_h4_enabled=false to match
  # Pine when 'Use Daily HTF' / 'Use H4 HTF' are unchecked.
  htf_daily_enabled: true
  htf_h4_enabled: true

  # Phase 08 update 2026-09-02: SL distance filter.
  # Pine slDist = OB_size + 0.2*ATR (OB size EURUSD M15 ~ 0.5-1.8 ATR).
  # min_sl_atr=0.3 = allow OB nhỏ, chỉ skip extremes (< 3 pips).
  # max_sl_atr=4.0 = match Pine `rulebookSlMaxAtr`.
  # Python backtest confirms filter is no-op at these levels.
  min_sl_atr: 0.3
  max_sl_atr: 4.0
  # Pine parity: rulebookEntryProximityAtr (default 1.5).
  # Reject trade if entry > this many ATRs from current close.
  rulebook_entry_proximity_atr: 1.5
  # Partial TP: 40% tại 2R, 30% tại 3R, 30% tại 4R
  partial_tp:
    - {pct: 0.40, r: 2.0, move_sl_to: entry}   # BE sau khi hit 2R
    - {pct: 0.30, r: 3.0, move_sl_to: entry}   # BE giữ
    - {pct: 0.30, r: 4.0, move_sl_to: entry}

  # Exit mode: 'ladder' (PartialTPExit default) | 'scale_in' (ScaleInExit 2R/4R).
  # Phase 08 decision 2026-09-02: switched to scale_in as primary.
  # 10y backtest (2016-2026): PF 3.56, MaxDD -3.40%, 604 trades, +456% ROI.
  # Manual trade + bot both use scale_in (Design A: 50% @ 2R, 50% leg2 @ 4R).
  # Ladder exit code retained in src/strategy.py for reference but not used.
  exit_mode: scale_in
  # Optional Design B: leg2 takes 50% profit at this R from original entry.
  # null/omitted = Design A (leg2 runs full to 4R). Set to 3.0 for Design B.
  # Design B: winrate +5.7pp, DD -0.5pp, nhưng PnL -3.2% vs Design A.
  leg2_tp1_r: null

  sl_atr_buffer: 0.2            # SL thêm 0.2× ATR buffer dưới OB

# Confluence scoring
confluence:
  weights:
    displacement: 1             # BẮT BUỘC
    bias_aligned: 1             # BẮT BUỘC
    sweep_clean: 1
    premium_discount: 1
    first_test: 1

# Pairs
pairs:
  - EURUSD
  - XAUUSD
  - BTCUSD

# Timeframes
timeframes:
  - D
  - H4
  - H1
  - M15

# Sessions (NY time, EST)
sessions:
  asia: {start: "19:00", end: "02:00"}
  london: {start: "02:00", end: "05:00"}
  new_york: {start: "07:00", end: "10:00"}
  overlap: {start: "08:00", end: "10:00"}    # London + NY

# Trade chỉ trong các session này
active_sessions:
  - london
  - new_york
  - overlap

# Pip value (USD per 1.0 lot per 1 pip)
pip_values:
  EURUSD: 10.0
  XAUUSD: 1.0     # XAU: 1 pip = $0.01, 1 lot = 100 oz
  BTCUSD: 1.0     # BTC: đơn vị USD, 1 lot = 1 BTC

# Data download
data:
  years: 10
  dukascopy_eurusd_url: "https://data.dukasbase.com/dukascopy-pip-data/EURUSD/"
  histdata_xau_url: "https://www.histdata.com/download/free-1-minute-foreign-exchange-data/"
  binance_btc_symbol: "BTC/USDT"
