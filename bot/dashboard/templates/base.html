<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMC Bot Admin — {{ page_title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* === Design System Tokens (ak-ui-ux-pro-max recommendation) === */
    :root {
      --color-primary: #2563EB;
      --color-secondary: #3B82F6;
      --color-cta: #F97316;
      --color-background: #F8FAFC;
      --color-text: #1E293B;
      --color-text-muted: #64748B;
      --color-card: #FFFFFF;
      --color-border: #E2E8F0;
      --color-success: #22C55E;
      --color-warning: #F59E0B;
      --color-danger: #EF4444;
      --color-bullish: #26A69A;
      --color-bearish: #EF5350;
      --space-xs: 4px;  --space-sm: 8px;  --space-md: 16px;
      --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
      --radius-sm: 4px;  --radius-md: 8px;  --radius-lg: 12px;
      --font-heading: 'Fira Code', ui-monospace, monospace;
      --font-body: 'Fira Sans', system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-background: #0F172A;
        --color-text: #F1F5F9;
        --color-text-muted: #94A3B8;
        --color-card: #1E293B;
        --color-border: #334155;
      }
    }
    /* === Reset + Base === */
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: var(--font-body);
      line-height: 1.5;
      background: var(--color-background);
      color: var(--color-text);
      min-height: 100vh;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 600; margin: 0 0 var(--space-md); letter-spacing: -0.01em; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.25rem; }
    h3 { font-size: 1.125rem; }
    code, .mono { font-family: var(--font-heading); font-size: 0.875rem; }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    /* === Navigation === */
    header {
      background: var(--color-card);
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-md) var(--space-lg);
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--space-md);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: var(--space-sm); font-family: var(--font-heading); font-weight: 700; color: var(--color-primary); }
    .brand-mark {
      width: 32px; height: 32px; background: var(--color-primary); border-radius: var(--radius-md);
      display: inline-flex; align-items: center; justify-content: center; color: white; font-weight: 700;
    }
    nav { display: flex; gap: var(--space-xs); }
    nav a {
      color: var(--color-text-muted);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.15s ease;
    }
    nav a:hover { background: var(--color-background); color: var(--color-text); text-decoration: none; }
    nav a.active { background: var(--color-primary); color: white; }
    /* === Main === */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--space-lg) var(--space-md) var(--space-2xl);
    }
    .breadcrumb {
      font-size: 0.875rem; color: var(--color-text-muted); margin-bottom: var(--space-md);
    }
    .breadcrumb a { color: var(--color-text-muted); }
    /* === Cards === */
    .card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      margin-bottom: var(--space-md);
      box-shadow: var(--shadow-sm);
    }
    .card-title { font-size: 0.875rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-md); margin-bottom: var(--space-lg); }
    .kpi-card { background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-md) var(--space-lg); box-shadow: var(--shadow-sm); }
    .kpi-value { font-family: var(--font-heading); font-size: 2rem; font-weight: 700; color: var(--color-text); line-height: 1.2; }
    .kpi-label { font-size: 0.875rem; color: var(--color-text-muted); margin-top: var(--space-xs); }
    .kpi-trend { font-size: 0.75rem; margin-top: var(--space-xs); }
    .kpi-trend.up { color: var(--color-success); }
    .kpi-trend.down { color: var(--color-danger); }
    /* === Tables (data-dense, overflow-x on mobile) === */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-card); }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead { background: var(--color-background); }
    th, td { text-align: left; padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--color-border); white-space: nowrap; }
    th { font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.75rem; cursor: pointer; user-select: none; }
    th:hover { color: var(--color-text); }
    th[aria-sort="ascending"]::after { content: ' ▲'; }
    th[aria-sort="descending"]::after { content: ' ▼'; }
    tbody tr:hover { background: var(--color-background); }
    tbody tr:last-child td { border-bottom: none; }
    .signal-id { font-family: var(--font-heading); color: var(--color-text-muted); font-size: 0.8rem; }
    /* === Badges === */
    .badge { display: inline-block; padding: 2px var(--space-sm); border-radius: var(--radius-sm); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-accept { background: #DCFCE7; color: #166534; }
    .badge-reject { background: #FEE2E2; color: #991B1B; }
    .badge-blocked { background: #FEF3C7; color: #92400E; }
    .badge-watch { background: #DBEAFE; color: #1E40AF; }
    .badge-chart { background: #D1FAE5; color: #065F46; }
    .badge-neutral { background: var(--color-background); color: var(--color-text-muted); }
    @media (prefers-color-scheme: dark) {
      .badge-accept { background: #14532D; color: #86EFAC; }
      .badge-reject { background: #7F1D1D; color: #FCA5A5; }
      .badge-blocked { background: #78350F; color: #FCD34D; }
      .badge-watch { background: #1E3A8A; color: #93C5FD; }
      .badge-chart { background: #064E3B; color: #6EE7B7; }
    }
    /* === Filters / Forms === */
    .filters { display: flex; gap: var(--space-md); flex-wrap: wrap; align-items: flex-end; margin-bottom: var(--space-md); }
    .filter-group { display: flex; flex-direction: column; gap: var(--space-xs); }
    .filter-group label { font-size: 0.75rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    input[type="text"], input[type="search"], input[type="date"], select {
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-card);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 0.875rem;
      min-height: 44px; /* touch target */
    }
    input:focus, select:focus { outline: 2px solid var(--color-primary); outline-offset: 1px; }
    /* === Buttons (44px min touch target) === */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: var(--space-xs);
      min-height: 44px; padding: var(--space-sm) var(--space-lg);
      border-radius: var(--radius-sm); font-weight: 500; font-size: 0.875rem;
      cursor: pointer; border: 1px solid transparent; transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover { text-decoration: none; }
    .btn-primary { background: var(--color-primary); color: white; }
    .btn-primary:hover { background: #1D4ED8; }
    .btn-secondary { background: var(--color-card); color: var(--color-text); border-color: var(--color-border); }
    .btn-secondary:hover { background: var(--color-background); }
    .btn-cta { background: var(--color-cta); color: white; }
    .btn-cta:hover { background: #EA580C; }
    /* === Empty states === */
    .empty {
      text-align: center; padding: var(--space-2xl) var(--space-lg); color: var(--color-text-muted);
    }
    .empty h3 { color: var(--color-text); }
    .empty code { background: var(--color-background); padding: 2px var(--space-xs); border-radius: var(--radius-sm); }
    /* === Focus visible (a11y) === */
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    /* === Reduced motion === */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    /* === Mobile (≤ 640px) === */
    @media (max-width: 640px) {
      header { flex-wrap: wrap; padding: var(--space-md); }
      nav { width: 100%; overflow-x: auto; }
      main { padding: var(--space-md); }
      .kpi-value { font-size: 1.5rem; }
      th, td { padding: var(--space-sm); font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/admin-legacy" class="brand">
      <span class="brand-mark">S</span>
      <span>SMC Bot</span>
    </a>
    <nav>
      <a href="/admin-legacy" class="{{ 'active' if page == 'legacy' or page == 'live' else '' }}">Live</a>
      <a href="/admin-execution" class="{{ 'active' if page == 'execution' else '' }}">Execution</a>
      <a href="/admin-replay" class="{{ 'active' if page == 'replay' else '' }}">Replay</a>
      <a href="/admin-audit" class="{{ 'active' if page == 'audit' else '' }}">Audit</a>
    </nav>
  </header>
  <main>
    <div class="breadcrumb"><a href="/admin-legacy">Dashboard</a> {% if breadcrumb %} / {{ breadcrumb }}{% endif %}</div>
    <h1>{{ page_title }}</h1>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
